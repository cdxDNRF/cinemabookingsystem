server:
  port: 8080

spring:
  application:
    name: cinema-backend
  profiles:
    active: local
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/cinema?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: ${CINEMA_DB_PASSWORD:}

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.xd.cinema
  configuration:
    map-underscore-to-camel-case: true

cinema:
  jwt:
    secret: ${CINEMA_JWT_SECRET:}
    expire-hours: 24
  order:
    lock-minutes: 10


