<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="750" version="1.1" width="1100" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#4A90D9" height="50" rx="10" ry="10" stroke="none" stroke-width="1.5" width="1060" x="20" y="10" /><text dominant-baseline="middle" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="550.0" y="35">时序图 - 用户登录流程</text><rect fill="#4A90D9" height="50" rx="8" ry="8" stroke="#4A90D9" stroke-width="1.5" width="120" x="40" y="80" /><text dominant-baseline="middle" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" x="100" y="95">用户</text><text dominant-baseline="middle" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" x="100" y="111">浏览器</text><line stroke="#D9D9D9" stroke-dasharray="5,5" stroke-width="1" x1="100" x2="100" y1="130" y2="700" /><rect fill="#4A90D9" height="50" rx="8" ry="8" stroke="#4A90D9" stroke-width="1.5" width="120" x="290" y="80" /><text dominant-baseline="middle" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" x="350" y="95">Vue 前端</text><text dominant-baseline="middle" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" x="350" y="111">(LoginPage)</text><line stroke="#D9D9D9" stroke-dasharray="5,5" stroke-width="1" x1="350" x2="350" y1="130" y2="700" /><rect fill="#4A90D9" height="50" rx="8" ry="8" stroke="#4A90D9" stroke-width="1.5" width="120" x="540" y="80" /><text dominant-baseline="middle" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" x="600" y="95">AuthController</text><text dominant-baseline="middle" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" x="600" y="111">/api/auth/login</text><line stroke="#D9D9D9" stroke-dasharray="5,5" stroke-width="1" x1="600" x2="600" y1="130" y2="700" /><rect fill="#4A90D9" height="50" rx="8" ry="8" stroke="#4A90D9" stroke-width="1.5" width="120" x="790" y="80" /><text dominant-baseline="middle" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" x="850" y="95">数据库</text><text dominant-baseline="middle" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" x="850" y="111">MySQL</text><line stroke="#D9D9D9" stroke-dasharray="5,5" stroke-width="1" x1="850" x2="850" y1="130" y2="700" /><line stroke="#4A90D9" stroke-width="1.5" x1="100" x2="350" y1="170" y2="170" /><polygon fill="#4A90D9" points="343.5278640450004,174.7022820183398 350,170 343.5278640450004,165.2977179816602" /><text dominant-baseline="middle" fill="#4A90D9" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" x="225" y="160">1. 输入用户名/密码/角色</text><line stroke="#52C41A" stroke-width="1.5" x1="350" x2="600" y1="220" y2="220" /><polygon fill="#52C41A" points="593.5278640450005,224.7022820183398 600,220 593.5278640450005,215.2977179816602" /><text dominant-baseline="middle" fill="#52C41A" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" x="475" y="210">2. POST /api/auth/login</text><text dominant-baseline="middle" fill="#52C41A" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" x="475" y="224">{username, password, role}</text><line stroke="#722ED1" stroke-width="1.5" x1="600" x2="850" y1="290" y2="290" /><polygon fill="#722ED1" points="843.5278640450005,294.70228201833976 850,290 843.5278640450005,285.29771798166024" /><text dominant-baseline="middle" fill="#722ED1" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" x="725" y="280">3. 查询用户表</text><text dominant-baseline="middle" fill="#722ED1" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" x="725" y="294">验证密码(hash比对)</text><line stroke="#722ED1" stroke-width="1.5" x1="600" x2="850" y1="340" y2="340" /><polygon fill="#722ED1" points="843.5278640450005,344.70228201833976 850,340 843.5278640450005,335.29771798166024" /><text dominant-baseline="middle" fill="#722ED1" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" x="725" y="330">4. 返回用户记录</text><line stroke="#FAAD14" stroke-width="1.5" x1="600" x2="640" y1="390" y2="390" /><line stroke="#FAAD14" stroke-width="1.5" x1="640" x2="640" y1="390" y2="430" /><line stroke="#FAAD14" stroke-width="1.5" x1="640" x2="600" y1="430" y2="430" /><text dominant-baseline="middle" fill="#FAAD14" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" x="650" y="410">5. 生成 JWT Token
(含userId, role, 24h有效)</text><line stroke="#52C41A" stroke-width="1.5" x1="350" x2="600" y1="470" y2="470" /><polygon fill="#52C41A" points="593.5278640450005,474.70228201833976 600,470 593.5278640450005,465.29771798166024" /><text dominant-baseline="middle" fill="#52C41A" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" x="475" y="460">6. 返回 LoginResponse</text><text dominant-baseline="middle" fill="#52C41A" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" x="475" y="474">{token, role, userId, nickname...}</text><line stroke="#13C2C2" stroke-width="1.5" x1="350" x2="390" y1="530" y2="530" /><line stroke="#13C2C2" stroke-width="1.5" x1="390" x2="390" y1="530" y2="570" /><line stroke="#13C2C2" stroke-width="1.5" x1="390" x2="350" y1="570" y2="570" /><text dominant-baseline="middle" fill="#13C2C2" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" x="400" y="550">7. Pinia Store 存储
登录状态 + localStorage</text><line stroke="#4A90D9" stroke-width="1.5" x1="100" x2="350" y1="610" y2="610" /><polygon fill="#4A90D9" points="343.5278640450004,614.7022820183398 350,610 343.5278640450004,605.2977179816602" /><text dominant-baseline="middle" fill="#4A90D9" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" x="225" y="600">8. 路由跳转到</text><text dominant-baseline="middle" fill="#4A90D9" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" x="225" y="614">对应角色首页</text></svg>